[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitflow-assistant"
version = "1.0.0"
description = "Universal, safe and multi-platform Git & GitHub manager for the shell (Termux, Windows, Linux)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "GitFlow Assistant contributors" }]
keywords = ["git", "github", "cli", "tui", "termux", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Android",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13"]
yaml = ["PyYAML>=6"]
keyring = ["keyring>=24"]
full = ["rich>=13", "PyYAML>=6"]
dev = ["pytest>=7"]

[project.scripts]
gitflow = "gitflow_assistant.app:main"

[project.urls]
Homepage = "https://github.com/snaidermadilus-debug/gitflow-assistant"
Issues = "https://github.com/snaidermadilus-debug/gitflow-assistant/issues"

[tool.setuptools.packages.find]
include = ["gitflow_assistant*"]

[tool.setuptools.package-data]
gitflow_assistant = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that need internet and real credentials (opt-in with GITFLOW_NETWORK_TESTS=1)"]
